name: Java 17

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build (Java ${{ matrix.java-version }})
    strategy:
      matrix:
        java-version: ['17', '21']
    timeout-minutes: 5
    defaults:
      run:
        working-directory: java17
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - run: ./mvnw test -q -Dtest=OptimalPortfolioScenarioTest
      - name: Order scenario test should fail at the rebalance assertion
        run: |
          "${GITHUB_WORKSPACE}/.github/scripts/expect-order-scenario-failure.sh" \
            ./mvnw test -q -Dtest=OrderScenarioTest
        env:
          EXPECTED_FAILURE: 'expected 19000 but was 20000'
