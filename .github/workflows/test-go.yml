name: Go

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    timeout-minutes: 5
    defaults:
      run:
        working-directory: golang
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: 'golang/go.mod'
          cache: true
      - run: go mod download
      - run: go build ./...
      - run: go fmt ./...
      - run: go vet ./...
      - run: go test ./test/... -run TestOptimalPortfolioScenario
      - name: Order scenario test should fail at the rebalance assertion
        run: |
          "${GITHUB_WORKSPACE}/.github/scripts/expect-order-scenario-failure.sh" \
            go test ./test/... -run TestOrderScenario
        env:
          EXPECTED_FAILURE: 'asset3 Toyopa amount: got 20000, want 19000'
