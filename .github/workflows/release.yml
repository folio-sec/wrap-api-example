name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create zip archives
        run: |
          for dir in golang java17 java8 php python ruby scala typescript; do
            zip -r "${dir}.zip" "${dir}/"
          done
        shell: bash

      - name: Create release and upload assets
        run: |
          TAG="release-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            --title "Implementations $TAG" \
            --notes "Auto-generated release of implementation samples" \
            golang.zip java17.zip java8.zip php.zip python.zip ruby.zip scala.zip typescript.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      - name: Delete old releases
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
            | while read -r tag; do
                echo "Deleting release: $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
