name: Java 8

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build (Java ${{ matrix.java-version }})
    strategy:
      matrix:
        java-version: ['8', '11']
    timeout-minutes: 5
    defaults:
      run:
        working-directory: java8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - name: Verify interview template and patch
        run: '"${GITHUB_WORKSPACE}/scripts/verify-interview-patch.sh" java8 .'
      - name: Test template portfolio scenario
        run: ./mvnw test -q -Dtest=OptimalPortfolioScenarioTest
      - name: Apply interview patch
        run: '"${GITHUB_WORKSPACE}/scripts/apply-interview-patch.sh" java8 .'
      - name: Test assembled portfolio scenario
        run: ./mvnw test -q -Dtest=OptimalPortfolioScenarioTest
      - name: Order scenario test should fail at the rebalance assertion
        run: |
          "${GITHUB_WORKSPACE}/.github/scripts/expect-order-scenario-failure.sh" \
            ./mvnw test -q -Dtest=OrderScenarioTest
        env:
          EXPECTED_FAILURE: 'expected 19000 but was 20000'
