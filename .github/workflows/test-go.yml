name: Go

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    timeout-minutes: 5
    defaults:
      run:
        working-directory: golang
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'golang/go.mod'
          cache: true
      - run: go mod download
      - name: Verify interview template and patch
        run: '"${GITHUB_WORKSPACE}/scripts/verify-interview-patch.sh" golang .'
      - name: Build template
        run: go build ./...
      - name: Vet template
        run: go vet ./...
      - name: Test template portfolio scenario
        run: go test ./test/... -run TestOptimalPortfolioScenario
      - name: Apply interview patch
        run: '"${GITHUB_WORKSPACE}/scripts/apply-interview-patch.sh" golang .'
      - name: Build assembled interview
        run: go build ./...
      - name: Format assembled interview
        run: go fmt ./...
      - name: Vet assembled interview
        run: go vet ./...
      - name: Test assembled portfolio scenario
        run: go test ./test/... -run TestOptimalPortfolioScenario
      - name: Order scenario test should fail at the rebalance assertion
        run: |
          "${GITHUB_WORKSPACE}/.github/scripts/expect-order-scenario-failure.sh" \
            go test ./test/... -run TestOrderScenario
        env:
          EXPECTED_FAILURE: 'asset3 Toyopa amount: got 20000, want 19000'
