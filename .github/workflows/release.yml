name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golang:
    name: Verify Go
    uses: ./.github/workflows/test-go.yml
    permissions:
      contents: read

  java17:
    name: Verify Java 17
    uses: ./.github/workflows/test-java17.yml
    permissions:
      contents: read

  java8:
    name: Verify Java 8
    uses: ./.github/workflows/test-java8.yml
    permissions:
      contents: read

  php:
    name: Verify PHP
    uses: ./.github/workflows/test-php.yml
    permissions:
      contents: read

  python:
    name: Verify Python
    uses: ./.github/workflows/test-python.yml
    permissions:
      contents: read

  ruby:
    name: Verify Ruby
    uses: ./.github/workflows/test-ruby.yml
    permissions:
      contents: read

  scala:
    name: Verify Scala
    uses: ./.github/workflows/test-scala.yml
    permissions:
      contents: read

  typescript:
    name: Verify TypeScript
    uses: ./.github/workflows/test-typescript.yml
    permissions:
      contents: read

  package:
    needs:
      - golang
      - java17
      - java8
      - php
      - python
      - ruby
      - scala
      - typescript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build template, patch, and assembled assets
        run: ./scripts/build-release-assets.sh release-assets
        shell: bash

      - name: Create release and upload assets
        run: |
          TAG="release-$(date +%Y%m%d-%H%M%S)"
          NOTES_FILE="$(mktemp)"
          {
            echo "Auto-generated interview assets."
            echo
            echo "- \`<language>.zip\`: assembled archive for the existing interview flow"
            echo "- \`<language>-template.zip\`: template for pre-interview setup"
            echo "- \`<language>.patch\`: interview content applied at interview start"
            echo
            echo "Apply a patch from the extracted language directory (the directory that contains README.md):"
            echo
            echo "\`\`\`bash"
            echo "curl -fsSL \"https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/<language>.patch\" | patch -p1"
            echo "\`\`\`"
            echo
            echo "\`patch -p1\` always resolves paths against the current directory. \`git apply\` would also work, but only when the language directory is the root of a git repository (or not inside one); run from a subdirectory of a repository it silently skips every file."
          } > "$NOTES_FILE"
          gh release create "$TAG" \
            --title "Implementations $TAG" \
            --notes-file "$NOTES_FILE" \
            release-assets/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      - name: Delete old releases
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
            | while read -r tag; do
                echo "Deleting release: $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
